[package]
name = "biblefnd"
version = "0.1.0"
edition = "2021"
description = "Look up King James Version Bible verses from the terminal"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
strip = true
lto = true
